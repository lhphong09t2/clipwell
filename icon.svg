<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="cw-title">
  <title id="cw-title">Clipwell — The Hash Clip</title>
  <defs>
    <!-- Continuous-corner Apple superellipse squircle (952x952 centered at 512,512) -->
    <path id="cw-squircle" d="M 260 36 L 764 36 C 838 36, 885 66.2, 921.4 102.6 C 957.8 139, 988 186, 988 260 L 988 764 C 988 838, 957.8 885, 921.4 921.4 C 885 957.8, 838 988, 764 988 L 260 988 C 186 988, 139 957.8, 102.6 921.4 C 66.2 885, 36 838, 36 764 L 36 260 C 36 186, 66.2 139, 102.6 102.6 C 139 66.2, 186 36, 260 36 Z"/>

    <clipPath id="cw-squircle-clip">
      <use href="#cw-squircle"/>
    </clipPath>

    <!-- Clip paths for authentic 3D over/under weave contact shadows -->
    <clipPath id="cw-top-bar-clip">
      <rect x="196" y="392" width="632" height="76" rx="38"/>
    </clipPath>
    <clipPath id="cw-bot-bar-clip">
      <rect x="196" y="640" width="632" height="76" rx="38"/>
    </clipPath>
    <clipPath id="cw-left-stem-clip">
      <rect x="336" y="314" width="76" height="578" rx="38"/>
    </clipPath>
    <clipPath id="cw-right-stem-clip">
      <rect x="612" y="314" width="76" height="490" rx="38"/>
    </clipPath>

    <!-- -60deg Warm Obsidian squircle lighting (#2A2826 -> #141312) -->
    <linearGradient id="cw-obsidian" x1="256" y1="68" x2="768" y2="956" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2826"/>
      <stop offset="0.48" stop-color="#1E1D1B"/>
      <stop offset="1" stop-color="#141312"/>
    </linearGradient>

    <radialGradient id="cw-top-sheen" cx="320" cy="140" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#FFFDF9" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cw-cell-halo" cx="512" cy="554" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7E47" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#D94322" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D94322" stop-opacity="0"/>
    </radialGradient>

    <!-- 3px top specular rim highlight (-60deg) -->
    <linearGradient id="cw-rim" x1="220" y1="36" x2="804" y2="988" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.38"/>
      <stop offset="0.35" stop-color="#FFFDF9" stop-opacity="0.12"/>
      <stop offset="0.75" stop-color="#FFFDF9" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Satin Warm Alabaster U-arch paperclip wire (#FFFDF9 -> #DFD9CE) -->
    <linearGradient id="cw-wire-v" x1="280" y1="138" x2="744" y2="892" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="0.52" stop-color="#F2EEE6"/>
      <stop offset="1" stop-color="#DFD9CE"/>
    </linearGradient>

    <!-- Satin Warm Alabaster horizontal # bars (slight depth step for crisp 3D weave read) -->
    <linearGradient id="cw-wire-h" x1="240" y1="360" x2="784" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="0.5" stop-color="#EBE5DA"/>
      <stop offset="1" stop-color="#D8D1C4"/>
    </linearGradient>

    <linearGradient id="cw-wire-rim" x1="260" y1="138" x2="764" y2="892" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#AEA698" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glowing International Vermilion-Amber Captured Cell (#FF7E47 -> #D94322) -->
    <linearGradient id="cw-cell-grad" x1="432" y1="478" x2="592" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF7E47"/>
      <stop offset="0.48" stop-color="#EE5B31"/>
      <stop offset="1" stop-color="#D94322"/>
    </linearGradient>

    <linearGradient id="cw-cell-rim" x1="422" y1="478" x2="602" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4EC" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#FF9E75" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7A1D0A" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Squircle contact + ambient drop shadow (dy=10 stdDeviation=8, zero bottom viewBox clip) -->
    <filter id="cw-base-shadow" x="-10%" y="-8%" width="120%" height="122%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#090808" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#090808" flood-opacity="0.26"/>
    </filter>

    <!-- Interior glyph elevation shadow onto Warm Obsidian squircle -->
    <filter id="cw-glyph-shadow" x="-14%" y="-12%" width="128%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#080707" flood-opacity="0.56"/>
      <feDropShadow dx="4" dy="18" stdDeviation="16" flood-color="#080707" flood-opacity="0.42"/>
    </filter>

    <!-- Captured cell luminous elevation shadow -->
    <filter id="cw-cell-shadow" x="-24%" y="-24%" width="148%" height="156%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#090807" flood-opacity="0.58"/>
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#9A260D" flood-opacity="0.36"/>
    </filter>

    <!-- Tight weave contact occlusion blur -->
    <filter id="cw-weave-occ" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g transform="translate(0 -4)">
    <!-- 1. Dimensional Warm Obsidian Squircle -->
    <g filter="url(#cw-base-shadow)">
      <use href="#cw-squircle" fill="url(#cw-obsidian)"/>
    </g>

    <g clip-path="url(#cw-squircle-clip)">
      <rect width="1024" height="1024" fill="url(#cw-top-sheen)"/>
      <circle cx="512" cy="554" r="220" fill="url(#cw-cell-halo)"/>

      <!-- 2. Luminous Captured Table Cell at Center -->
      <g filter="url(#cw-cell-shadow)">
        <rect x="422" y="478" width="180" height="152" rx="26" fill="url(#cw-cell-grad)"/>
        <rect x="434" y="490" width="156" height="30" rx="11" fill="#FFF7F0" fill-opacity="0.22"/>
        <rect x="423.5" y="479.5" width="177" height="149" rx="24.5" fill="none" stroke="url(#cw-cell-rim)" stroke-width="3"/>
      </g>

      <!-- 3. Woven Satin Alabaster Hash-Paperclip Structure -->
      <g filter="url(#cw-glyph-shadow)">
        <!-- Base Horizontal # Bars -->
        <rect x="196" y="392" width="632" height="76" rx="38" fill="url(#cw-wire-h)"/>
        <rect x="196" y="640" width="632" height="76" rx="38" fill="url(#cw-wire-h)"/>

        <!-- Base U-Arch Paperclip Stems (Left leg deeper y=892, Right leg shorter y=804) -->
        <path d="M 336 854 A 38 38 0 0 0 412 854 L 412 314 A 100 100 0 0 1 612 314 L 612 766 A 38 38 0 0 0 688 766 L 688 314 A 176 176 0 0 0 336 314 Z" fill="url(#cw-wire-v)"/>
      </g>

      <!-- 4. 3D Over/Under Basket Weave Contact Shadows & Seamless Over-Passes -->
      <!-- Crossing TL (374, 430): Left Stem goes OVER Top Bar -->
      <g clip-path="url(#cw-top-bar-clip)">
        <rect x="328" y="372" width="92" height="116" fill="#0B0A09" fill-opacity="0.62" filter="url(#cw-weave-occ)"/>
      </g>
      <rect x="336" y="336" width="76" height="176" fill="url(#cw-wire-v)"/>

      <!-- Crossing TR (650, 430): Top Bar goes OVER Right Stem -->
      <g clip-path="url(#cw-right-stem-clip)">
        <rect x="592" y="384" width="116" height="92" fill="#0B0A09" fill-opacity="0.62" filter="url(#cw-weave-occ)"/>
      </g>
      <path d="M 556 392 L 790 392 A 38 38 0 0 1 790 468 L 556 468 Z" fill="url(#cw-wire-h)"/>

      <!-- Crossing BL (374, 678): Bottom Bar goes OVER Left Stem -->
      <g clip-path="url(#cw-left-stem-clip)">
        <rect x="316" y="632" width="116" height="92" fill="#0B0A09" fill-opacity="0.62" filter="url(#cw-weave-occ)"/>
      </g>
      <path d="M 234 640 L 468 640 L 468 716 L 234 716 A 38 38 0 0 1 234 640 Z" fill="url(#cw-wire-h)"/>

      <!-- Crossing BR (650, 678): Right Stem goes OVER Bottom Bar -->
      <g clip-path="url(#cw-bot-bar-clip)">
        <rect x="604" y="620" width="92" height="116" fill="#0B0A09" fill-opacity="0.62" filter="url(#cw-weave-occ)"/>
      </g>
      <path d="M 612 584 L 688 584 L 688 766 A 38 38 0 0 1 612 766 Z" fill="url(#cw-wire-v)"/>

      <!-- Subtle Wire Top/Left Specular Catchlights -->
      <path d="M 337.5 512 L 337.5 314 A 174.5 174.5 0 0 1 686.5 314" fill="none" stroke="url(#cw-wire-rim)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="234" y1="393.5" x2="334" y2="393.5" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="414" y1="393.5" x2="790" y2="393.5" stroke="#FFFFFF" stroke-opacity="0.68" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="234" y1="641.5" x2="610" y2="641.5" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="690" y1="641.5" x2="790" y2="641.5" stroke="#FFFFFF" stroke-opacity="0.52" stroke-width="2.2" stroke-linecap="round"/>

      <!-- 5. 3px Inner Specular Squircle Rim -->
      <use href="#cw-squircle" fill="none" stroke="url(#cw-rim)" stroke-width="6"/>
    </g>
  </g>
</svg>
